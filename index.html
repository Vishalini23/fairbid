<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FairBid - Portal Selection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; margin-bottom: 30px; }
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .role-btn {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .farmer-btn { background-color: #27ae60; color: white; }
        .farmer-btn:hover { background-color: #219653; }
        .buyer-btn { background-color: #2980b9; color: white; }
        .buyer-btn:hover { background-color: #2471a3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌾 Welcome to FairBid</h1>
        <p>Transparent Agricultural Auctions & Direct Fair Pricing</p>
        
        <div class="btn-group">
            <!-- Points to farmer_login.html -->
            <a href="farmer_login.html" class="role-btn farmer-btn">I am a Farmer</a>
            <!-- Points to buyer_login.html -->
            <a href="buyer.html" class="role-btn buyer-btn">I am a Buyer</a>
        </div>
    </div>

</body>
</html>
